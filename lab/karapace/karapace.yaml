apiVersion: apps/v1
kind: Deployment
metadata:
  name: karapace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karapace
  template:
    metadata:
      labels:
        app: karapace
    spec:
      containers:
        - name: karapace
          image: ghcr.io/aiven-open/karapace:5.0.3
          command: ["python3", "-m", "karapace"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: KARAPACE_KARAPACE_REGISTRY
              value: "true"
            - name: KARAPACE_KARAPACE_REST
              value: "false"
            - name: KARAPACE_BOOTSTRAP_URI
              value: ingest-platform-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KARAPACE_HOST
              value: "0.0.0.0"
            - name: KARAPACE_PORT
              value: "8081"
            - name: KARAPACE_ADVERTISED_HOSTNAME
              value: karapace
            - name: KARAPACE_ADVERTISED_PROTOCOL
              value: http
            - name: KARAPACE_SECURITY_PROTOCOL
              value: PLAINTEXT
            - name: KARAPACE_CLIENT_ID
              value: karapace-0
            - name: KARAPACE_GROUP_ID
              value: karapace-registry
            - name: KARAPACE_MASTER_ELIGIBILITY
              value: "true"
            - name: KARAPACE_TOPIC_NAME
              value: _schemas
            - name: KARAPACE_REPLICATION_FACTOR
              value: "3"
            - name: KARAPACE_LOG_LEVEL
              value: INFO
---
apiVersion: v1
kind: Service
metadata:
  name: karapace
spec:
  type: ClusterIP
  selector:
    app: karapace
  ports:
    - name: http
      port: 8081
      targetPort: 8081