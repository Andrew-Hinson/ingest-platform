# Demo Project YAML. Not production source.
# Creator Project: Instance create and Table DDL. Topic, ACL, and connector are derived.
project: acme
cluster: ingest-platform
instance:
  create: true
tables:
  - name: orders
    columns:
      - name: id
        type: serial
        primary_key: true
      - name: user_id
        type: integer
        nullable: false
      - name: amount
        type: numeric
        nullable: false
      - name: updated_at
        type: timestamptz
        nullable: false
