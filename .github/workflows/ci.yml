name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GO_MODULES: cmd/ingestctl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: gofmt
        run: |
          test -z "$(gofmt -l $GO_MODULES)"
      - name: go vet and test
        run: |
          for d in $GO_MODULES; do
            go vet -C "$d" ./...
            go test -C "$d" ./...
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
      - name: terraform fmt
        run: terraform fmt -check $(git ls-files '*.tf')
      - name: terraform validate
        working-directory: tf
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' 'apiVersion: v1' 'kind: Config' 'clusters: []' 'contexts: []' 'current-context: ""' 'users: []' > "$HOME/.kube/config"
          terraform init -backend=false
          terraform validate
